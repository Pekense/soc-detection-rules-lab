#title: Suspicious PowerShell Execution
id: 10000001-0000-0000-0000-000000000001
status: experimental
description: Detecta ejecución sospechosa de PowerShell con parámetros habituales en ataques.
author: Rafa
date: 2026/07/02
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-enc'
      - '-nop'
      - 'IEX'
      - 'DownloadString'
  condition: selection
falsepositives:
  - Scripts administrativos legítimos
level: high
tags:
  - attack.execution
  - attack.t1059.001
